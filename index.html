<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>RootShell Icon — Variants</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: #0c0b08; color: #ebe3d0;
    font: 14px/1.5 ui-monospace, 'JetBrains Mono', Menlo, monospace; }
  header { padding: 32px 48px 24px; border-bottom: 1px solid #221f1a; }
  h1 { margin: 0 0 6px; font: 600 22px/1.2 ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.01em; }
  p.lede { margin: 0; opacity: 0.6; max-width: 60ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 32px; padding: 32px 48px 64px; }
  .card { display: flex; flex-direction: column; gap: 12px; }
  .icon { aspect-ratio: 1/1; border-radius: 22.37%;
    overflow: hidden; box-shadow: 0 1px 0 rgba(255,255,255,0.04), 0 8px 24px -12px rgba(0,0,0,0.6); }
  .icon svg { display: block; width: 100%; height: 100%; }
  .meta { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .id { font-size: 11px; opacity: 0.45; letter-spacing: 0.04em; }
  .name { font-size: 12px; opacity: 0.85; }
  .swatches { display: flex; gap: 4px; }
  .sw { width: 12px; height: 12px; border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); }
  footer { padding: 24px 48px 48px; opacity: 0.4; font-size: 12px; }
  footer code { background: #1a1814; padding: 1px 6px; border-radius: 3px; }
</style>
</head>
<body>
<header>
  <h1>RootShell — icon variants</h1>
  <p class="lede">√~ — twelve terminal-theme colorways. Geometry shared from <code>src/geometry.js</code>; colors from <code>src/variants.js</code>.</p>
</header>
<div class="grid" id="grid"></div>
<footer>Run <code>npm run build</code> in the repo root to render PNG iconsets for all variants.</footer>

<script type="module">
import { VARIANTS } from './src/variants.js?v=3';
import { renderSVG } from './src/geometry.js?v=3';

const grid = document.getElementById('grid');
for (const v of VARIANTS) {
  const card = document.createElement('div');
  card.className = 'card';
  const icon = document.createElement('div');
  icon.className = 'icon';
  icon.innerHTML = renderSVG(v, 220);
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = `
    <div>
      <div class="id">${v.id}</div>
      <div class="name">${v.name}</div>
    </div>
    <div class="swatches">
      <div class="sw" style="background:${v.bg}" title="bg ${v.bg}"></div>
      <div class="sw" style="background:${v.stroke}" title="stroke ${v.stroke}"></div>
      ${v.tildeStroke ? `<div class="sw" style="background:${v.tildeStroke}" title="tildeStroke ${v.tildeStroke}"></div>` : ''}
    </div>`;
  card.append(icon, meta);
  grid.append(card);
}
</script>
</body>
</html>
